name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-milestone6.txt

      - name: Compile check
        run: python -m compileall app entrypoints scripts tests

      - name: Run Milestone 5/6 test suites
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pytest -q \
            tests/test_milestone5_regression.py \
            tests/test_milestone5_governance.py \
            tests/test_milestone5_production.py \
            tests/test_milestone6_security.py \
            --junitxml=artifacts/pytest-results.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: artifacts/pytest-results.xml
