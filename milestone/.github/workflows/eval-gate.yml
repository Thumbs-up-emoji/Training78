name: Eval Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  governance-eval-gate:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-milestone6.txt

      - name: Run Milestone 6 security regression tests
        run: pytest -q tests/test_milestone6_security.py

      - name: Run evaluation and guardrail regression gate
        run: python scripts/eval_gate.py

      - name: Run golden-set evaluation gate
        run: python -m app.ops.golden_eval

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-artifacts
          path: |
            artifacts/eval_report.json
            artifacts/eval_report.md
            output/golden_eval_report.json
            output/golden_eval_report.md
            output/golden_eval_baseline.json
