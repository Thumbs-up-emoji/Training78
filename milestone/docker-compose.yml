services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # The existing ResearchAssistant uses Redis when this URL is reachable.
      REDIS_URL: redis://retrieval:6379/0
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
    depends_on:
      retrieval:
        condition: service_healthy
    networks:
      - milestone6
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 15s
      timeout: 5s
      retries: 5

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    env_file:
      - .env
    environment:
      # Docker DNS, never a host IP or localhost, connects the UI to FastAPI.
      MILESTONE5_API_BASE_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - milestone6

  # The project already uses Redis as its persistent episodic/semantic memory
  # retrieval backend. This containerizes that existing store; it does not
  # replace the M3/M4 local-document retrieval logic with a new vector DB.
  retrieval:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - retrieval_data:/data
    networks:
      - milestone6
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  milestone6:
    driver: bridge

volumes:
  retrieval_data: